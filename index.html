<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد الخطابات المحاسبية</title>
  
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip-utils.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
    }
    .partner-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-add {
      background-color: #198754;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn-remove {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .checkbox-group {
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      background-color: #fdfdfd;
      margin-bottom: 20px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .checkbox-item input {
      margin-left: 10px;
      width: 18px;
      height: 18px;
    }
    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: #0b5ed7; }
    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
    .status-success { background-color: #d1e7dd; color: #0f5132; }
    .status-error { background-color: #f8d7da; color: #842029; }
  </style>
</head>
<body>

<div class="container">
  <h2>نظام توليد الخطابات المحاسبية</h2>

  <form id="docForm">
    <!-- اسم المنشأة / الشركة -->
    <div class="form-group">
      <label for="companyName">اسم المنشأة / الشركة:</label>
      <input type="text" id="companyName" list="companyList" required placeholder="اختر أو اكتب اسم المنشأة...">
      <datalist id="companyList">
        <option value="السعادة">
        <option value="الوادي الأخضر">
        <option value="الوفاق">
      </datalist>
    </div>

    <!-- رقم السجل التجاري -->
    <div class="form-group">
      <label for="crNumber">رقم السجل التجاري:</label>
      <input type="text" id="crNumber" placeholder="أدخل رقم السجل التجاري">
    </div>

    <!-- الكيان القانوني -->
    <div class="form-group">
      <label for="entityType">نوع الكيان القانوني:</label>
      <select id="entityType">
        <option value="شركة">شركة</option>
        <option value="مؤسسة">مؤسسة</option>
      </select>
    </div>

    <!-- الشخص المفوض بالتوقيع -->
    <div class="form-group">
      <label for="authorizedPerson">اسم الشخص المفوض بالتوقيع:</label>
      <input type="text" id="authorizedPerson" placeholder="أدخل اسم الشخص المفوض">
    </div>

    <!-- إضافة الشركاء ديناميكياً -->
    <div class="form-group">
      <label>أسماء الشركاء:</label>
      <div id="partnersContainer">
        <div class="partner-row">
          <input type="text" class="partner-input" placeholder="اسم الشريك 1">
        </div>
      </div>
      <button type="button" class="btn-add" onclick="addPartnerField()">+ إضافة شريك آخر</button>
    </div>

    <!-- تقويم تاريخ الخطاب -->
    <div class="form-group">
      <label for="gDate">تاريخ الخطاب:</label>
      <input type="date" id="gDate" required>
    </div>

    <!-- تقويم تاريخ نهاية السنة المالية -->
    <div class="form-group">
      <label for="yearEnd">تاريخ نهاية السنة المالية:</label>
      <input type="date" id="yearEnd" required>
    </div>

    <!-- تحديد الخطابات -->
    <div class="form-group">
      <label>حدد الخطابات المطلوب توليدها:</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="chk_rep" checked>
          <label for="chk_rep">خطاب التمثيل (representation_letter.docx)</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="chk_app" checked>
          <label for="chk_app">قرار التعيين (template1.docx)</label>
        </div>
      </div>
    </div>

    <button type="button" class="btn-submit" onclick="runMainController()">توليد وتنزيل المستندات</button>
  </form>

  <div id="status" class="status-msg"></div>
</div>

<script>
  // ضبط التواريخ الإفتراضية
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  
  document.getElementById('gDate').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('yearEnd').value = `${yyyy}-12-31`;

  // إضافة خانة شريك جديد
  function addPartnerField() {
    const container = document.getElementById("partnersContainer");
    const count = container.getElementsByClassName("partner-row").length + 1;
    const div = document.createElement("div");
    div.className = "partner-row";
    div.innerHTML = `
      <input type="text" class="partner-input" placeholder="اسم الشريك ${count}">
      <button type="button" class="btn-remove" onclick="this.parentElement.remove()">حذف</button>
    `;
    container.appendChild(div);
  }

  // حساب اسم اليوم بالعربي بدون الاعتماد على المتصفح
  function getArabicDayName(dateStr) {
    if (!dateStr) return "";
    const [year, month, day] = dateStr.split('-').map(Number);
    const dateObj = new Date(year, month - 1, day);
    const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    return days[dateObj.getDay()] || "";
  }

  // تحويل التاريخ لنص عربي شامل الدقة (يوم شهر سنة)
  function formatArabicDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;

    const year = parts[0];
    const monthIndex = parseInt(parts[1], 10) - 1;
    const day = parseInt(parts[2], 10);

    const months = [
      "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
      "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
    ];

    return `${day} ${months[monthIndex]} ${year}م`;
  }

  function getEntityFormatures(type) {
    if (type === "شركة") {
      return { entityThe: "الشركة", entityFor: "للشركة" };
    } else {
      return { entityThe: "المؤسسة", entityFor: "لمؤسسة" };
    }
  }

  async function renderDocument(templateName, outputFilename, payload) {
    const response = await fetch(templateName);
    if (!response.ok) {
      throw new Error(`تعذر تحميل القالب: ${templateName}`);
    }
    const blob = await response.blob();
    const arrayBuffer = await blob.arrayBuffer();

    const PizZipLib = window.PizZip || PizZip;
    const zip = new PizZipLib(arrayBuffer);
    const doc = new window.docxtemplater(zip, {
      paragraphLoop: true,
      linebreaks: true,
      nullGetter: function() { return ""; }
    });

    doc.render(payload);

    const out = doc.getZip().generate({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    });

    saveAs(out, outputFilename);
  }

  async function runMainController() {
    const statusDiv = document.getElementById("status");
    statusDiv.style.display = "none";

    const companyName = document.getElementById("companyName").value.trim();
    const crNumber = document.getElementById("crNumber").value.trim();
    const rawGDate = document.getElementById("gDate").value;
    const rawYearEnd = document.getElementById("yearEnd").value;
    const entityType = document.getElementById("entityType").value;
    const authorizedPerson = document.getElementById("authorizedPerson").value.trim();

    // تجميع الشركاء من الخانات المتعددة
    const partnerInputs = document.querySelectorAll(".partner-input");
    const partnerList = [];
    partnerInputs.forEach(input => {
      if (input.value.trim() !== "") {
        partnerList.push(input.value.trim());
      }
    });

    const partnersText = partnerList.join(" و ");

    if (!companyName || !rawGDate || !rawYearEnd) {
      alert("يرجى تعبئة كافة الحقول المطلوبة واختيار التواريخ.");
      return;
    }

    const forms = getEntityFormatures(entityType);
    const formattedGDate = formatArabicDate(rawGDate);
    const formattedYearEnd = formatArabicDate(rawYearEnd);
    const dayName = getArabicDayName(rawGDate);

    // تجهيز البيانات لكافة وسوم القوالب
    const payload = {
      companyName: companyName,
      crNumber: crNumber,
      gDate: formattedGDate,
      yearEnd: formattedYearEnd,
      dayName: dayName,
      entityThe: forms.entityThe,
      entityFor: forms.entityFor,
      authorizedPerson: authorizedPerson,
      partners: partnersText,
      partnerName: partnersText,
      partnersList: partnerList.map(name => ({ name: name }))
    };

    const tasks = [];
    if (document.getElementById("chk_rep").checked) {
      tasks.push(renderDocument("representation_letter.docx", `خطاب_التمثيل_${companyName}.docx`, payload));
    }
    if (document.getElementById("chk_app").checked) {
      tasks.push(renderDocument("template1.docx", `قرار_التعيين_${companyName}.docx`, payload));
    }

    if (tasks.length === 0) {
      alert("يرجى اختيار خطاب واحد على الأقل للتوليد.");
      return;
    }

    try {
      await Promise.all(tasks);
      statusDiv.className = "status-msg status-success";
      statusDiv.innerText = "تم توليد وتنزيل المستندات بنجاح!";
      statusDiv.style.display = "block";
    } catch (err) {
      console.error(err);
      statusDiv.className = "status-msg status-error";
      statusDiv.innerText = "حدث خطأ أثناء التوليد: " + err.message;
      statusDiv.style.display = "block";
    }
  }
</script>

</body>
</html>
