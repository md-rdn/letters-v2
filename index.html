<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد الخطابات المحاسبية</title>
  
  <!-- مكتبات مضمونة ومحدثة لـ PizZip و docxtemplater و FileSaver -->
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.min.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
    }
    .checkbox-group {
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      background-color: #fdfdfd;
      margin-bottom: 20px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .checkbox-item:last-child {
      margin-bottom: 0;
    }
    .checkbox-item input {
      margin-left: 10px;
      width: 18px;
      height: 18px;
    }
    button {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
    .status-success { background-color: #d1e7dd; color: #0f5132; }
    .status-error { background-color: #f8d7da; color: #842029; }
    #partnersGroup { display: none; } /* إخفاء حقل الشركاء افتراضياً */
  </style>
</head>
<body>

<div class="container">
  <h2>مولد الخطابات والقرارات المحاسبية</h2>

  <form id="docForm">
    <div class="form-group">
      <label for="companyName">اسم المنشأة/الشركة:</label>
      <input type="text" id="companyName" required placeholder="مثال: شركة الوفاق">
    </div>

    <div class="form-group">
      <label for="entityType">نوع الكيان القانوني:</label>
      <select id="entityType" onchange="togglePartnersField()">
        <option value="مؤسسة">مؤسسة</option>
        <option value="شركة">شركة</option>
      </select>
    </div>

    <!-- حقل أسماء الشركاء (يظهر عند اختيار شركة) -->
    <div class="form-group" id="partnersGroup">
      <label for="partners">أسماء الشركاء / الشريك:</label>
      <textarea id="partners" rows="2" placeholder="أدخل أسماء الشركاء يفصل بينهم فاصلة (مثال: محمد أحمد، عبد الله خالد)"></textarea>
    </div>

    <div class="form-group">
      <label for="gDate">تاريخ الخطاب:</label>
      <input type="date" id="gDate" required>
    </div>

    <div class="form-group">
      <label for="yearEnd">تاريخ نهاية السنة المالية:</label>
      <input type="text" id="yearEnd" placeholder="مثال: 31 ديسمبر 2025م">
    </div>

    <div class="form-group">
      <label>حدد الخطابات المطلوب توليدها:</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="chk_rep" checked>
          <label for="chk_rep">خطاب التمثيل (representation_letter.docx)</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="chk_app">
          <label for="chk_app">قرار التعيين (template1.docx)</label>
        </div>
      </div>
    </div>

    <button type="button" onclick="runMainController()">توليد وتنزيل المستندات</button>
  </form>

  <div id="status" class="status-msg"></div>
</div>

<script>
  // تعيين تاريخ اليوم افتراضياً
  document.getElementById('gDate').valueAsDate = new Date();

  // إظهار وإخفاء حقل الشركاء بناءً على نوع الكيان
  function togglePartnersField() {
    const entityType = document.getElementById("entityType").value;
    const partnersGroup = document.getElementById("partnersGroup");
    if (entityType === "شركة") {
      partnersGroup.style.display = "block";
    } else {
      partnersGroup.style.display = "none";
    }
  }

  // تنسيق التاريخ إلى اللغة العربية
  function formatArabicDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;

    const year = parts[0];
    const monthIndex = parseInt(parts[1], 10) - 1;
    const day = parseInt(parts[2], 10);

    const months = [
      "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
      "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
    ];

    if (monthIndex < 0 || monthIndex > 11) return dateStr;
    return `${day} ${months[monthIndex]} ${year}م`;
  }

  // تحديد الصيغة اللغوية للمؤسسة أو الشركة
  function getEntityFormatures(type) {
    if (type === "شركة") {
      return { entityThe: "الشركة", entityFor: "للشركة" };
    } else {
      return { entityThe: "المؤسسة", entityFor: "لمؤسسة" };
    }
  }

  // دالة التوليد الموحدة والمستقلة
  async function renderDocument(templateName, outputFilename, payload) {
    const response = await fetch(templateName);
    if (!response.ok) {
      throw new Error(`تعذر العثور على القالب: ${templateName}`);
    }
    const blob = await response.blob();
    const arrayBuffer = await blob.arrayBuffer();

    // التحقق من وجود PizZip لتفادي توقف السكريبت
    if (typeof PizZip === 'undefined') {
      throw new Error("لم يتم تحميل مكتبة PizZip بنجاح، يرجى التحديث وإعادة المحاولة.");
    }

    const zip = new PizZip(arrayBuffer);
    const doc = new window.docxtemplater(zip, {
      paragraphLoop: true,
      linebreaks: true
    });

    doc.render(payload);

    const out = doc.getZip().generate({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    });

    saveAs(out, outputFilename);
  }

  // المتحكم الرئيسي
  async function runMainController() {
    const statusDiv = document.getElementById("status");
    statusDiv.style.display = "none";

    const companyName = document.getElementById("companyName").value.trim();
    const rawDate = document.getElementById("gDate").value;
    const yearEnd = document.getElementById("yearEnd").value.trim();
    const entityType = document.getElementById("entityType").value;
    const partners = document.getElementById("partners").value.trim();

    if (!companyName || !rawDate) {
      alert("يرجى تعبئة اسم المنشأة وتاريخ الخطاب.");
      return;
    }

    const forms = getEntityFormatures(entityType);
    const formattedDate = formatArabicDate(rawDate);

    // كائن البيانات الشامل للمتغيرات داخل ملفات الـ Word
    const payload = {
      companyName: companyName,
      gDate: formattedDate,
      yearEnd: yearEnd,
      entityThe: forms.entityThe,
      entityFor: forms.entityFor,
      partners: partners // متوفر الآن للاستخدام داخل القوالب بنفس الاسم {partners}
    };

    const tasks = [];
    if (document.getElementById("chk_rep").checked) {
      tasks.push(renderDocument("representation_letter.docx", `خطاب_التمثيل_${companyName}.docx`, payload));
    }
    if (document.getElementById("chk_app").checked) {
      tasks.push(renderDocument("template1.docx", `قرار_التعيين_${companyName}.docx`, payload));
    }

    if (tasks.length === 0) {
      alert("يرجى اختيار خطاب واحد على الأقل للتوليد.");
      return;
    }

    try {
      await Promise.all(tasks);
      statusDiv.className = "status-msg status-success";
      statusDiv.innerText = "تم توليد وتنزيل المستندات بنجاح!";
      statusDiv.style.display = "block";
    } catch (err) {
      console.error(err);
      statusDiv.className = "status-msg status-error";
      statusDiv.innerText = "حدث خطأ أثناء التوليد: " + err.message;
      statusDiv.style.display = "block";
    }
  }
</script>

</body>
</html>
